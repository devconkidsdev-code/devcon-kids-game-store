<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DEVCON Kids Game Store</title>
    <meta
      name="description"
      content="Play games built by DEVCON Kids in Google AI Studio."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/store.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container header-inner">
        <a class="brand" href="index.html" aria-label="DEVCON Kids Game Store home">
          <img src="logo.png" alt="DEVCON Kids" />
        </a>
        <nav class="nav-links" aria-label="Primary">
          <a href="index.html">Games</a>
        </nav>
      </div>
    </header>

    <main>
      <section class="container hero" aria-labelledby="hero-title">
        <h1 id="hero-title">Classroom Play Store</h1>
        <p>
          Discover games vibe-coded by kids in our DEVCON Kids classes —
          built with Google AI Studio and ready to play.
        </p>
      </section>

      <section class="container" aria-labelledby="games-heading">
        <div class="toolbar">
          <h2 id="games-heading">All games</h2>
          <div class="search">
            <label class="visually-hidden" for="search">Search games</label>
            <input
              id="search"
              type="search"
              placeholder="Search games, creators, school…"
              autocomplete="off"
            />
          </div>
        </div>
        <div id="game-grid" class="game-grid" aria-live="polite">
          <p class="state">Loading games…</p>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container">DEVCON Kids · Classroom Play Store</div>
    </footer>

    <style>
      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
    </style>
    <script src="assets/js/store.js" defer></script>
  </body>
</html>
